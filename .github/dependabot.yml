# Keeps the SHA-pinned GitHub Actions and the dependencies up to date.
# Prefixes are hidden in the changelog (see release-please-config.json), so
# dependency updates never bump the version on their own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
