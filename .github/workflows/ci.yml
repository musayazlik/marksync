name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # CI builds are never released, so they may use a placeholder Firefox ID.
      MARKSYNC_UNRELEASED_BUILD: '1'
    steps:
      # Third-party actions should be pinned to full commit SHAs before any
      # release or secret-using step is added to this workflow.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:all
