name: Release

# Versioning is done by release-please (docs: CONTRIBUTING.md#releases):
# 1. Every push to main updates a "release PR" that bumps package.json and
#    writes CHANGELOG.md from the Conventional Commit messages since the last
#    release (feat → minor, fix → patch; before 1.0.0 a breaking change → minor).
# 2. Merging that PR tags vX.Y.Z and publishes a GitHub Release.
# 3. The store packages are then built from the tag and attached to it.
#
# "Run workflow" (workflow_dispatch) builds and attaches the packages again
# for an existing release, e.g. after a failed upload or once WXT_GECKO_ID is
# set. It never creates a release or changes the version.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build packages for (e.g. v0.2.0)
        required: true
        type: string

# No permissions by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags, releases, the release branch
      issues: write # labels on the release PR
      pull-requests: write # opens and updates the release PR
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds with a read-only token: dependencies run here, so this job cannot
  # change the repository or the release.
  build:
    needs: release-please
    # On a manual run release-please is skipped, so do not require it to succeed.
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      # Repository variables (Settings → Secrets and variables → Actions → Variables).
      # Both values end up inside the published extension, so they are not secrets.
      WXT_GOOGLE_CLIENT_ID: ${{ vars.WXT_GOOGLE_CLIENT_ID }}
      # The web viewer's address, for shared-folder invitation links (optional).
      WXT_VIEWER_URL: ${{ vars.VIEWER_URL }}
      WXT_GECKO_ID: ${{ vars.WXT_GECKO_ID }}
    steps:
      - name: Release tag
        id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$TAG\" is not a release tag like v1.2.3."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache in release builds, so a poisoned cache cannot reach a release.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check release settings
        run: |
          if [ -z "$WXT_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Repository variable WXT_GOOGLE_CLIENT_ID is not set; the extension could not sign in to Google."
            exit 1
          fi
          actual=$(node -p "require('./package.json').version")
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::package.json is at $actual but the release is $VERSION."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Package Chrome, Edge and Opera
        run: |
          pnpm exec wxt zip
          pnpm exec wxt zip -b edge
          pnpm exec wxt zip -b opera

      # Production Firefox builds need an add-on ID the publisher owns (wxt.config.ts).
      - name: Package Firefox (with the sources zip for Firefox Add-ons)
        if: env.WXT_GECKO_ID != ''
        run: pnpm exec wxt zip -b firefox
      - name: Firefox skipped
        if: env.WXT_GECKO_ID == ''
        run: echo "::warning::Repository variable WXT_GECKO_ID is not set, so this release has no Firefox package."

      # upload-artifact skips hidden folders such as .output, so the packages
      # are collected in a plain folder first.
      - name: Collect packages and checksums
        run: |
          mkdir packages
          cp .output/*.zip packages/
          cd packages
          sha256sum *.zip | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packages/
          if-no-files-found: error
          retention-days: 7

  # Only this job can write to the release, and it runs no project code.
  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
