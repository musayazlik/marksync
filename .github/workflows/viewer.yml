name: Web viewer

# Builds the read-only web viewer (viewer/) and publishes it to GitHub Pages.
# Runs only when the repository variable VIEWER_GOOGLE_CLIENT_ID is set (the
# viewer's "Web application" OAuth client, see docs/GOOGLE_SETUP.md) and
# Pages is set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - 'src/core/**'
      - 'src/platform/drive.ts'
      - 'src/assets/**'
      - '.github/workflows/viewer.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.VIEWER_GOOGLE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:viewer
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VIEWER_GOOGLE_CLIENT_ID }}
          # For the shared-folder invitation page (Google Picker); optional.
          VITE_GOOGLE_API_KEY: ${{ vars.VIEWER_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.GOOGLE_PROJECT_NUMBER }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .output/viewer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
