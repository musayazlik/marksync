<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="dupTitle">Marksync</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Text comes from src/public/_locales (see src/shared/i18n.ts). -->
    <header class="top">
      <div class="top-inner">
        <svg id="emblem" class="emblem" data-state="ok" viewBox="0 0 100 100" width="40" height="40" aria-hidden="true">
          <rect class="bg" width="100" height="100" rx="26" />
          <g class="arrows">
            <path d="M21.8 60.3A30 30 0 0 1 74.6 32.8" />
            <path d="M74.6 23.8L74.6 32.8L66.1 29.7" />
            <path d="M78.2 39.7A30 30 0 0 1 25.4 67.2" />
            <path d="M25.4 76.2L25.4 67.2L33.9 70.3" />
          </g>
          <path class="ribbon" d="M40 31H60V69L50 61.5L40 69Z" />
        </svg>
        <div class="top-text">
          <h1 data-i18n="dupTitle"></h1>
          <p class="muted small" data-i18n="dupIntro"></p>
        </div>
        <a class="button" href="./options.html" data-i18n="aiLogBack"></a>
      </div>
    </header>

    <main>
      <div class="toolbar">
        <div id="summary" class="summary"></div>
        <div class="row">
          <button id="rescan" class="quiet" data-i18n="dupScanAgain"></button>
          <button id="remove" class="primary" disabled></button>
        </div>
      </div>

      <p id="result" class="notice ok small" role="status" hidden></p>

      <div id="scanning" class="empty" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <p data-i18n="dupScanning"></p>
      </div>

      <div id="groups" class="groups"></div>

      <div id="none" class="empty" hidden>
        <svg viewBox="0 0 24 32" width="28" height="36" aria-hidden="true"><path d="M2 2h20v28l-10-7-10 7z" /></svg>
        <p data-i18n="dupNone"></p>
      </div>
    </main>

    <p id="action-error" class="notice error small toast" role="alert" hidden></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
