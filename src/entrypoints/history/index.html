<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="historyTitle">Marksync</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Text comes from src/public/_locales (see src/shared/i18n.ts). -->
    <header class="top">
      <div class="top-inner">
        <svg id="emblem" class="emblem" data-state="ok" viewBox="0 0 100 100" width="40" height="40" aria-hidden="true">
          <path class="front" d="M23.8 4.1L54.9 4.1A10 10 0 0 1 64.9 14.1L64.9 22.8A7.2 7.2 0 0 1 62.3 28.4L21.3 62.5A4.6 4.6 0 0 1 13.8 59L13.8 14.1A10 10 0 0 1 23.8 4.1Z" />
          <path class="back" d="M86.2 35.4L86.2 91.4A4.4 4.4 0 0 1 79.1 94.9L57.6 78.6A0.8 0.8 0 0 0 56.6 78.6L36 94.3A4.4 4.4 0 0 1 28.9 90.8L28.9 64.9A5.2 5.2 0 0 1 30.8 60.8L70.7 28.1A9.5 9.5 0 0 1 86.2 35.4Z" />
        </svg>
        <div class="top-text">
          <h1 data-i18n="historyTitle"></h1>
          <p class="muted small" data-i18n="historyIntro"></p>
        </div>
        <a class="button" href="./options.html#sec-backups" data-i18n="aiLogBack"></a>
      </div>
    </header>

    <main>
      <div class="picker">
        <label for="backup" class="small" data-i18n="historyBackupLabel"></label>
        <select id="backup"></select>
      </div>

      <div class="toolbar">
        <div id="filters" class="filters" role="group" data-i18n-aria-label="historyFilters">
          <button type="button" class="chip" data-filter="all" aria-pressed="true"></button>
          <button type="button" class="chip" data-filter="removed" aria-pressed="false"></button>
          <button type="button" class="chip" data-filter="moved" aria-pressed="false"></button>
          <button type="button" class="chip" data-filter="renamed" aria-pressed="false"></button>
          <button type="button" class="chip" data-filter="added" aria-pressed="false"></button>
        </div>
        <div class="row">
          <input id="filter-text" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="historyFilterPlaceholder" data-i18n-aria-label="historyFilterPlaceholder" />
          <button id="restore" class="primary" disabled></button>
        </div>
      </div>

      <p id="result" class="notice ok small" role="status" hidden></p>

      <div id="loading" class="empty" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <p data-i18n="historyLoading"></p>
      </div>

      <div id="groups" class="groups"></div>

      <div id="none" class="empty" hidden>
        <svg viewBox="0 0 24 32" width="28" height="36" aria-hidden="true"><path d="M2 2h20v28l-10-7-10 7z" /></svg>
        <p id="none-text"></p>
      </div>

      <!-- "Which backup still had …?" -->
      <section class="finder" aria-labelledby="finder-h">
        <h2 id="finder-h" data-i18n="historyFindHeading"></h2>
        <p class="muted small" data-i18n="historyFindIntro"></p>
        <form id="find-form" class="row">
          <input id="find" type="search" autocomplete="off" spellcheck="false" maxlength="200" data-i18n-placeholder="historyFindPlaceholder" data-i18n-aria-label="historyFindHeading" />
          <button id="find-btn" type="submit" data-i18n="historyFindButton"></button>
        </form>
        <p id="find-status" class="muted small" role="status" hidden></p>
        <ul id="hits" class="hits"></ul>
      </section>
    </main>

    <p id="action-error" class="notice error small toast" role="alert" hidden></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
