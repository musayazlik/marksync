<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="true" />
    <title data-i18n="optionsTitle">Marksync</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Text comes from src/public/_locales (see src/shared/i18n.ts). -->
    <header class="hero">
      <div class="hero-inner">
        <svg id="emblem" class="emblem" data-state="off" viewBox="0 0 100 100" width="64" height="64" aria-hidden="true">
          <path class="front" d="M23.8 4.1L54.9 4.1A10 10 0 0 1 64.9 14.1L64.9 22.8A7.2 7.2 0 0 1 62.3 28.4L21.3 62.5A4.6 4.6 0 0 1 13.8 59L13.8 14.1A10 10 0 0 1 23.8 4.1Z" />
          <path class="back" d="M86.2 35.4L86.2 91.4A4.4 4.4 0 0 1 79.1 94.9L57.6 78.6A0.8 0.8 0 0 0 56.6 78.6L36 94.3A4.4 4.4 0 0 1 28.9 90.8L28.9 64.9A5.2 5.2 0 0 1 30.8 60.8L70.7 28.1A9.5 9.5 0 0 1 86.2 35.4Z" />
        </svg>
        <div class="hero-text">
          <div class="row wrap">
            <h1>Marksync</h1>
            <a id="version" class="pill" target="_blank" rel="noopener" data-i18n-title="versionNotes"></a>
          </div>
          <p id="account-text" class="hero-account"></p>
          <p id="sync-text" class="muted"></p>
        </div>
        <div class="hero-actions row">
          <button id="connect" class="primary" data-i18n="connectDrive"></button>
          <button id="disconnect" class="quiet" data-i18n="disconnect" hidden></button>
        </div>
      </div>
      <p id="sync-error" class="notice error small hero-error" hidden></p>
    </header>

    <div class="layout">
      <nav class="rail" data-i18n-aria-label="optionsTitle">
        <span class="rail-ribbon" aria-hidden="true"></span>
        <a href="#sec-sync" data-i18n="syncHeading"></a>
        <a href="#sec-backups" data-i18n="backupsHeading"></a>
        <a href="#sec-encryption" data-i18n="encHeading"></a>
        <a href="#import" data-i18n="importHeading"></a>
        <a href="#ai" data-i18n="aiHeading"></a>
      </nav>

      <main class="stack">
        <!-- Shown once, on the page opened right after installing. -->
        <section id="welcome" class="notice ok stack" aria-labelledby="welcome-h" hidden>
          <h2 id="welcome-h" data-i18n="welcomeHeading"></h2>
          <p data-i18n="welcomeConnect"></p>
          <p class="muted small" data-i18n="welcomeNoDuplicates"></p>
          <p class="muted small" data-i18n="privacyNote"></p>
        </section>

        <section id="sec-sync" class="section" aria-labelledby="sync-h">
          <h2 id="sync-h" data-i18n="syncHeading"></h2>
          <div class="panel">
            <div class="setting">
              <div class="setting-text">
                <label for="syncEnabled" data-i18n="syncEnabledLabel"></label>
                <p class="muted small" data-i18n="syncHelp"></p>
              </div>
              <input id="syncEnabled" type="checkbox" />
            </div>
            <div class="setting">
              <div class="setting-text"><label for="syncIntervalMin" data-i18n="syncIntervalLabel"></label></div>
              <select id="syncIntervalMin">
                <option value="1" data-i18n="interval1Min"></option>
                <option value="5" data-i18n="interval5Min"></option>
                <option value="15" data-i18n="interval15Min"></option>
                <option value="60" data-i18n="interval1Hour"></option>
              </select>
            </div>
            <div class="setting">
              <div class="setting-text">
                <label for="digestFrequency" data-i18n="digestSettingLabel"></label>
                <p class="muted small" data-i18n="digestSettingHelp"></p>
              </div>
              <select id="digestFrequency">
                <option value="off" data-i18n="digestOff"></option>
                <option value="daily" data-i18n="digestDaily"></option>
                <option value="weekly" data-i18n="digestWeekly"></option>
              </select>
            </div>
            <div class="setting">
              <div class="setting-text">
                <span class="setting-title" data-i18n="dupSettingLabel"></span>
                <p class="muted small" data-i18n="dupSettingHelp"></p>
              </div>
              <a class="button" href="./duplicates.html" data-i18n="dupOpen"></a>
            </div>
            <div class="setting">
              <div class="setting-text">
                <span class="setting-title" data-i18n="linkSettingLabel"></span>
                <p class="muted small" data-i18n="linkSettingHelp"></p>
              </div>
              <a class="button" href="./links.html" data-i18n="linkOpen"></a>
            </div>
            <div class="setting">
              <div class="setting-text">
                <label for="deviceName" data-i18n="deviceNameLabel"></label>
                <p class="muted small" data-i18n="deviceNameHelp"></p>
              </div>
              <input id="deviceName" type="text" maxlength="60" />
            </div>
          </div>
        </section>

        <section id="sec-backups" class="section" aria-labelledby="backup-h">
          <div class="section-head">
            <h2 id="backup-h" data-i18n="backupsHeading"></h2>
            <div class="row">
              <button id="export" data-i18n="exportHtml"></button>
              <button id="backup-now" class="primary" data-i18n="backupNow"></button>
            </div>
          </div>
          <div class="panel">
            <div class="setting">
              <div class="setting-text"><label for="autoBackup" data-i18n="autoBackupLabel"></label></div>
              <input id="autoBackup" type="checkbox" />
            </div>
            <div class="setting sentence">
              <span data-i18n="backupEveryBefore"></span>
              <select id="backupIntervalHours">
                <option value="6" data-i18n="backupEvery6Hours"></option>
                <option value="24" data-i18n="backupEveryDay"></option>
                <option value="168" data-i18n="backupEveryWeek"></option>
              </select>
              <span data-i18n="backupKeepBefore"></span>
              <select id="backupRetention">
                <option value="10">10</option>
                <option value="30">30</option>
                <option value="90">90</option>
              </select>
              <span data-i18n="backupKeepAfter"></span>
            </div>
            <div class="panel-block">
              <table id="backups">
                <thead>
                  <tr><th data-i18n="columnDate"></th><th data-i18n="columnFrom"></th><th data-i18n="columnItems"></th><th></th></tr>
                </thead>
                <tbody></tbody>
              </table>
              <p id="backups-empty" class="empty muted small" data-i18n="noBackups" hidden></p>
            </div>
          </div>
          <p class="muted small" data-i18n="restoreHelp"></p>
        </section>

        <section id="sec-encryption" class="section" aria-labelledby="enc-h">
          <div class="section-head">
            <h2 id="enc-h" data-i18n="encHeading"></h2>
            <span id="enc-badge" class="pill" hidden></span>
          </div>
          <p class="muted" data-i18n="encIntro"></p>
          <div class="panel">
            <div id="enc-offline" class="panel-block" hidden>
              <p class="muted small" data-i18n="encNeedsConnect"></p>
            </div>

            <!-- Off: choose a passphrase. -->
            <form id="enc-off" class="panel-block stack" hidden>
              <div class="enc-fields">
                <label class="field">
                  <span class="small" data-i18n="encPassLabel"></span>
                  <input id="enc-pass" type="password" autocomplete="new-password" spellcheck="false" />
                </label>
                <label class="field">
                  <span class="small" data-i18n="encPassAgain"></span>
                  <input id="enc-pass2" type="password" autocomplete="new-password" spellcheck="false" />
                </label>
              </div>
              <div class="meter" data-level="0" aria-hidden="true"><span></span><span></span><span></span></div>
              <p id="enc-meter-text" class="muted small" aria-live="polite"></p>
              <label class="tick-label">
                <input id="enc-understand" type="checkbox" class="tick" />
                <span class="small" data-i18n="encUnderstand"></span>
              </label>
              <div class="row wrap">
                <button id="enc-enable" type="submit" class="primary" data-i18n="encEnable" disabled></button>
              </div>
            </form>

            <!-- Locked: on for the account, passphrase not entered here. -->
            <form id="enc-locked" class="panel-block stack" hidden>
              <p class="notice warn small" data-i18n="encLockedText"></p>
              <div class="key-row">
                <input
                  id="enc-unlock-pass"
                  type="password"
                  autocomplete="current-password"
                  spellcheck="false"
                  data-i18n-placeholder="encPassLabel"
                  data-i18n-aria-label="encPassLabel"
                />
                <button id="enc-unlock" type="submit" class="primary" data-i18n="encUnlock"></button>
              </div>
              <p id="enc-locked-meta" class="muted small"></p>
              <div>
                <button id="enc-reset" type="button" class="danger small-button" data-i18n="encForgot"></button>
              </div>
            </form>

            <!-- On and unlocked. -->
            <div id="enc-on" class="panel-block stack" hidden>
              <div class="enc-on-head">
                <svg class="enc-lock" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true">
                  <rect x="4" y="10.5" width="16" height="11" rx="3" />
                  <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" />
                  <circle cx="12" cy="16" r="1.6" />
                </svg>
                <div class="stack tight">
                  <strong data-i18n="encOnTitle"></strong>
                  <span id="enc-on-meta" class="muted small"></span>
                </div>
              </div>
              <ul class="hints muted small">
                <li data-i18n="encOnWhat"></li>
                <li data-i18n="encOnNot"></li>
                <li data-i18n="encOnOthers"></li>
              </ul>
              <div class="row wrap">
                <button id="enc-lock" type="button" data-i18n="encLock"></button>
                <button id="enc-disable" type="button" class="danger" data-i18n="encDisable"></button>
              </div>
            </div>
          </div>
        </section>

        <section id="import" class="section" aria-labelledby="import-h">
          <h2 id="import-h" data-i18n="importHeading"></h2>
          <p class="muted" data-i18n="importIntro"></p>
          <fieldset class="choices">
            <legend class="small muted" data-i18n="importHow"></legend>
            <label class="choice">
              <input type="radio" name="import-mode" value="merge" checked />
              <span data-i18n="importModeMerge"></span>
            </label>
            <label class="choice">
              <input type="radio" name="import-mode" value="folder" />
              <span data-i18n="importModeFolder"></span>
            </label>
          </fieldset>

          <div class="panel">
            <div class="panel-block">
              <h3 data-i18n="importFromBrowserHeading"></h3>
              <table id="browsers">
                <thead>
                  <tr><th data-i18n="columnBrowser"></th><th data-i18n="columnBookmarks"></th><th data-i18n="columnUpdated"></th><th></th></tr>
                </thead>
                <tbody></tbody>
              </table>
              <p id="browsers-empty" class="empty muted small" data-i18n="browsersEmpty" hidden></p>
              <p id="browsers-offline" class="empty muted small" data-i18n="browsersOffline" hidden></p>
            </div>
            <div class="panel-block stack">
              <h3 data-i18n="importFileHeading"></h3>
              <ul class="hints muted small">
                <li data-i18n="importFileHelp"></li>
                <li data-i18n="importFileChromium"></li>
                <li data-i18n="importFileFirefox"></li>
                <li data-i18n="importFileSafari"></li>
              </ul>
              <div class="row wrap">
                <input id="import-file" type="file" accept=".html,.htm,text/html" />
                <button id="import-file-btn" class="primary" data-i18n="importFileButton" disabled></button>
              </div>
            </div>
          </div>
          <p id="import-result" class="notice ok small" role="status" hidden></p>
        </section>

        <section id="ai" class="section" aria-labelledby="ai-h">
          <div class="section-head">
            <h2 id="ai-h" data-i18n="aiHeading"></h2>
            <a class="button" href="./sorter-log.html" data-i18n="aiOpenLog"></a>
          </div>
          <p class="muted" data-i18n="aiIntro"></p>
          <p id="ai-privacy" class="notice small"></p>
          <div class="panel">
            <div class="setting">
              <div class="setting-text"><label for="aiSortEnabled" data-i18n="aiEnabledLabel"></label></div>
              <input id="aiSortEnabled" type="checkbox" />
            </div>
            <div class="setting">
              <div class="setting-text"><label for="aiInboxFolderId" data-i18n="aiInboxLabel"></label></div>
              <select id="aiInboxFolderId">
                <option value="" data-i18n="aiInboxNone"></option>
              </select>
            </div>
            <div class="setting">
              <div class="setting-text">
                <label for="aiProvider" data-i18n="aiProviderLabel"></label>
                <p id="ai-provider-help" class="muted small"></p>
              </div>
              <select id="aiProvider">
                <option value="openrouter" data-i18n="aiProviderOpenRouter"></option>
                <option value="custom" data-i18n="aiProviderCustom"></option>
                <option value="builtin" data-i18n="aiProviderBuiltin"></option>
              </select>
            </div>
            <!-- OpenAI-compatible endpoint (Ollama, LM Studio, vLLM, ...). -->
            <div class="setting stacked" data-provider="custom">
              <div class="setting-text">
                <label for="ai-endpoint" data-i18n="aiEndpointLabel"></label>
                <p id="ai-endpoint-state" class="muted small"></p>
              </div>
              <div class="key-row">
                <input id="ai-endpoint" type="url" autocomplete="off" spellcheck="false" maxlength="300" placeholder="http://localhost:11434/v1" />
                <button id="ai-endpoint-save" data-i18n="aiKeySave"></button>
                <button id="ai-endpoint-test" data-i18n="aiTest"></button>
              </div>
              <p class="muted small" data-i18n="aiEndpointHelp"></p>
            </div>
            <div class="setting stacked" data-provider="custom">
              <div class="setting-text">
                <label for="ai-endpoint-model" data-i18n="aiEndpointModelLabel"></label>
              </div>
              <div class="key-row">
                <input id="ai-endpoint-model" list="ai-endpoint-models" autocomplete="off" spellcheck="false" maxlength="200" placeholder="llama3.2:3b" />
                <datalist id="ai-endpoint-models"></datalist>
                <button id="ai-endpoint-model-save" data-i18n="aiKeySave"></button>
              </div>
              <p class="muted small" data-i18n="aiEndpointModelHelp"></p>
            </div>
            <div class="setting stacked" data-provider="custom">
              <div class="setting-text">
                <label for="ai-endpoint-key" data-i18n="aiEndpointKeyLabel"></label>
                <p id="ai-endpoint-key-state" class="muted small"></p>
              </div>
              <div class="key-row">
                <input id="ai-endpoint-key" type="password" autocomplete="off" spellcheck="false" maxlength="500" />
                <button id="ai-endpoint-key-save" data-i18n="aiKeySave"></button>
                <button id="ai-endpoint-key-remove" class="danger" data-i18n="aiKeyRemove" hidden></button>
              </div>
              <p class="muted small" data-i18n="aiEndpointKeyHelp"></p>
            </div>
            <!-- The browser's own on-device model (Chrome: Gemini Nano). -->
            <div class="setting stacked" data-provider="builtin">
              <div class="setting-text">
                <span class="setting-title" data-i18n="aiBuiltinLabel"></span>
                <p id="ai-builtin-state" class="small" role="status"></p>
              </div>
              <div class="row wrap">
                <button id="ai-builtin-prepare" data-i18n="aiBuiltinPrepare" hidden></button>
                <progress id="ai-builtin-progress" max="1" hidden></progress>
              </div>
              <p class="muted small" data-i18n="aiBuiltinHelp"></p>
            </div>
            <div class="setting stacked" data-provider="openrouter">
              <div class="setting-text">
                <label for="ai-key" data-i18n="aiKeyLabel"></label>
                <p id="ai-key-state" class="muted small"></p>
              </div>
              <div class="key-row">
                <input id="ai-key" type="password" autocomplete="off" spellcheck="false" data-i18n-placeholder="aiKeyPlaceholder" />
                <button id="ai-key-save" data-i18n="aiKeySave"></button>
                <button id="ai-key-test" data-i18n="aiTest"></button>
                <button id="ai-key-remove" class="danger" data-i18n="aiKeyRemove" hidden></button>
              </div>
              <p class="muted small" data-i18n="aiKeyHelp"></p>
            </div>
            <div class="setting stacked model-setting" data-provider="openrouter">
              <div class="setting-text">
                <label for="ai-model-search" data-i18n="aiModelLabel"></label>
                <p id="ai-model-help" class="muted small"></p>
              </div>
              <!-- The chosen model; the ribbon marks it in the list too. -->
              <div id="ai-model-current" class="model-current" aria-live="polite"></div>
              <div class="model-picker">
                <div class="model-toolbar">
                  <div class="model-search">
                    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
                      <circle cx="8.5" cy="8.5" r="5.5" />
                      <path d="M13 13l4 4" />
                    </svg>
                    <input
                      id="ai-model-search"
                      type="search"
                      role="combobox"
                      aria-autocomplete="list"
                      aria-expanded="true"
                      aria-controls="ai-model-list"
                      autocomplete="off"
                      spellcheck="false"
                      maxlength="100"
                      data-i18n-placeholder="aiModelSearchPlaceholder"
                    />
                  </div>
                  <div class="model-filters" role="group" data-i18n-aria-label="aiModelFilters">
                    <button type="button" class="chip" data-filter="all" aria-pressed="true" data-i18n="aiModelFilterAll"></button>
                    <button type="button" class="chip" data-filter="free" aria-pressed="false" data-i18n="aiModelFilterFree"></button>
                    <button type="button" class="chip" data-filter="tools" aria-pressed="false" data-i18n="aiModelFilterTools"></button>
                  </div>
                </div>
                <ul id="ai-model-list" class="model-list" role="listbox" data-i18n-aria-label="aiModelLabel" tabindex="-1"></ul>
                <div class="model-foot">
                  <p id="ai-model-count" class="muted small" role="status"></p>
                  <button id="ai-model-refresh" type="button" class="quiet small-button" data-i18n="aiModelsRefresh"></button>
                </div>
              </div>
            </div>
            <div class="setting" data-provider="openrouter">
              <div class="setting-text">
                <label for="aiResearch" data-i18n="aiResearchLabel"></label>
                <p class="muted small" data-i18n="aiResearchHelp"></p>
              </div>
              <input id="aiResearch" type="checkbox" />
            </div>
            <div class="setting">
              <div class="setting-text"><label for="aiAllowNewFolders" data-i18n="aiAllowNewLabel"></label></div>
              <input id="aiAllowNewFolders" type="checkbox" />
            </div>
            <div class="setting" data-provider="openrouter">
              <div class="setting-text">
                <label for="aiMonthlyBudget" data-i18n="aiBudgetLabel"></label>
                <p id="ai-budget-help" class="muted small"></p>
              </div>
              <div class="money-input">
                <span aria-hidden="true">USD</span>
                <input id="aiMonthlyBudget" type="number" min="0" max="10000" step="0.5" inputmode="decimal" />
              </div>
            </div>
          </div>
          <p id="ai-status" class="notice small" role="status" hidden></p>
          <div class="row wrap">
            <button id="ai-sort-now" class="primary" data-i18n="aiSortNow"></button>
            <p id="ai-result" class="muted small" role="status" hidden></p>
          </div>

          <!-- Bulk sorting: proposals for a whole folder, applied only after review. -->
          <div id="bulk" class="panel bulk">
            <div class="panel-block stack">
              <div class="stack tight">
                <h3 data-i18n="aiBulkHeading"></h3>
                <p class="muted small" data-i18n="aiBulkIntro"></p>
              </div>
              <div class="bulk-form">
                <select id="bulk-folder" data-i18n-aria-label="aiBulkFolderLabel"></select>
                <label class="inline-switch" data-provider="openrouter">
                  <input id="bulk-research" type="checkbox" />
                  <span class="small" data-i18n="aiBulkResearch"></span>
                </label>
                <button id="bulk-start" class="primary" data-i18n="aiBulkStart"></button>
              </div>
            </div>
            <div id="bulk-run" class="panel-block stack" hidden>
              <div class="bulk-head">
                <div class="stack tight">
                  <strong id="bulk-title"></strong>
                  <span id="bulk-meta" class="muted small"></span>
                </div>
                <span id="bulk-cost" class="pill"></span>
              </div>
              <div id="bulk-gauge" class="bulk-gauge" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span></span></div>
              <p id="bulk-note" class="notice small" role="status" hidden></p>
              <div id="bulk-toolbar" class="bulk-toolbar" hidden>
                <label class="tick-label">
                  <input id="bulk-all" type="checkbox" class="tick" />
                  <span class="small" data-i18n="aiBulkSelectAll"></span>
                </label>
                <span id="bulk-selected" class="muted small"></span>
              </div>
              <ul id="bulk-list" class="bulk-list"></ul>
              <div class="row wrap bulk-actions">
                <button id="bulk-apply" class="primary"></button>
                <button id="bulk-stop" data-i18n="aiBulkStop"></button>
                <button id="bulk-discard" class="quiet"></button>
                <a id="bulk-log" class="button" href="./sorter-log.html" data-i18n="aiOpenLog" hidden></a>
              </div>
            </div>
          </div>

          <!-- Search by meaning: embeddings of every bookmark, opt-in. -->
          <div id="semantic" class="panel">
            <div class="panel-block stack">
              <div class="stack tight">
                <h3 data-i18n="semHeading"></h3>
                <p class="muted small" data-i18n="semIntro"></p>
              </div>
            </div>
            <div class="setting">
              <div class="setting-text">
                <label for="semanticEnabled" data-i18n="semEnabledLabel"></label>
                <p class="muted small" data-i18n="semPrivacy"></p>
              </div>
              <input id="semanticEnabled" type="checkbox" />
            </div>
            <div class="setting stacked">
              <div class="setting-text">
                <label for="sem-model" data-i18n="semModelLabel"></label>
                <p id="sem-model-help" class="muted small"></p>
              </div>
              <div class="key-row">
                <input id="sem-model" autocomplete="off" spellcheck="false" maxlength="200" />
                <button id="sem-model-save" data-i18n="aiKeySave"></button>
              </div>
            </div>
            <div class="panel-block stack">
              <p id="sem-status" class="small" role="status"></p>
              <div id="sem-gauge" class="bulk-gauge" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden><span></span></div>
              <div class="row wrap">
                <button id="sem-build" class="primary"></button>
                <button id="sem-stop" data-i18n="aiBulkStop" hidden></button>
                <button id="sem-delete" class="quiet danger" data-i18n="semDelete"></button>
              </div>
            </div>
          </div>

          <!-- Tidy up the library: folder merges, renames, empty folders, titles; applied only after review. -->
          <div id="tidy" class="panel bulk">
            <div class="panel-block stack">
              <div class="stack tight">
                <h3 data-i18n="tidyHeading"></h3>
                <p class="muted small" data-i18n="tidyIntro"></p>
              </div>
              <div class="bulk-form">
                <select id="tidy-scope" data-i18n-aria-label="tidyScopeLabel"></select>
                <button id="tidy-start" class="primary" data-i18n="tidyStart"></button>
              </div>
              <p id="tidy-estimate" class="muted small" role="status"></p>
            </div>
            <div id="tidy-run" class="panel-block stack" hidden>
              <div class="bulk-head">
                <div class="stack tight">
                  <strong id="tidy-title"></strong>
                  <span id="tidy-meta" class="muted small"></span>
                </div>
                <span id="tidy-cost" class="pill"></span>
              </div>
              <div id="tidy-gauge" class="bulk-gauge" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span></span></div>
              <p id="tidy-note" class="notice small" role="status" hidden></p>
              <ul id="tidy-list" class="bulk-list"></ul>
              <div class="row wrap bulk-actions">
                <button id="tidy-apply" class="primary"></button>
                <button id="tidy-stop" data-i18n="aiBulkStop"></button>
                <button id="tidy-discard" class="quiet"></button>
                <a id="tidy-log" class="button" href="./sorter-log.html" data-i18n="aiOpenLog" hidden></a>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <p id="action-error" class="notice error small toast" role="alert" hidden></p>
    <p id="action-ok" class="notice ok small toast" role="status" hidden></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
