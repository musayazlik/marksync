<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marksync</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Text comes from src/public/_locales (see src/shared/i18n.ts). -->
    <main class="stack">
      <header class="head">
        <svg id="emblem" class="emblem" data-state="off" viewBox="0 0 100 100" width="44" height="44" aria-hidden="true">
          <path class="front" d="M23.8 4.1L54.9 4.1A10 10 0 0 1 64.9 14.1L64.9 22.8A7.2 7.2 0 0 1 62.3 28.4L21.3 62.5A4.6 4.6 0 0 1 13.8 59L13.8 14.1A10 10 0 0 1 23.8 4.1Z" />
          <path class="back" d="M86.2 35.4L86.2 91.4A4.4 4.4 0 0 1 79.1 94.9L57.6 78.6A0.8 0.8 0 0 0 56.6 78.6L36 94.3A4.4 4.4 0 0 1 28.9 90.8L28.9 64.9A5.2 5.2 0 0 1 30.8 60.8L70.7 28.1A9.5 9.5 0 0 1 86.2 35.4Z" />
        </svg>
        <div class="head-text">
          <h1>Marksync</h1>
          <p id="email" class="muted small"></p>
        </div>
        <button id="open-options" class="quiet" data-i18n="openOptions" data-i18n-title="openOptionsTitle"></button>
      </header>

      <section id="disconnected" class="stack" hidden>
        <p data-i18n="popupIntro"></p>
        <p class="muted small" data-i18n="privacyNote"></p>
        <button id="connect" class="primary wide" data-i18n="connectDrive"></button>
      </section>

      <section id="connected" class="stack" hidden>
        <div class="status">
          <p id="summary-main" class="status-main"></p>
          <div id="summary" class="status-facts"></div>
        </div>

        <div id="mass-delete" class="notice warn stack" hidden>
          <p id="mass-delete-text" class="small"></p>
          <div class="row wrap">
            <button id="confirm-delete" class="danger"></button>
            <button id="bring-back" data-i18n="bringBack"></button>
            <button id="keep-local" data-i18n="keepLocal" hidden></button>
          </div>
        </div>

        <div id="error" class="notice error small" hidden></div>

        <div class="actions">
          <button id="sync" class="primary" data-i18n="syncNow"></button>
          <button id="backup" data-i18n="backupNow"></button>
        </div>
        <p id="backup-summary" class="muted small"></p>
      </section>

      <nav class="links">
        <button id="import" class="quiet" data-i18n="popupImport"></button>
        <button id="open-dupes" class="quiet" data-i18n="dupOpen"></button>
        <button id="open-log" class="quiet" data-i18n="aiOpenLog"></button>
      </nav>

      <p id="action-error" class="notice error small" role="alert" hidden></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
