<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marksync</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Text comes from src/public/_locales (see src/shared/i18n.ts). -->
    <main class="stack">
      <header class="head">
        <svg id="emblem" class="emblem" data-state="off" viewBox="0 0 100 100" width="44" height="44" aria-hidden="true">
          <path class="front" d="M23.8 4.1L54.9 4.1A10 10 0 0 1 64.9 14.1L64.9 22.8A7.2 7.2 0 0 1 62.3 28.4L21.3 62.5A4.6 4.6 0 0 1 13.8 59L13.8 14.1A10 10 0 0 1 23.8 4.1Z" />
          <path class="back" d="M86.2 35.4L86.2 91.4A4.4 4.4 0 0 1 79.1 94.9L57.6 78.6A0.8 0.8 0 0 0 56.6 78.6L36 94.3A4.4 4.4 0 0 1 28.9 90.8L28.9 64.9A5.2 5.2 0 0 1 30.8 60.8L70.7 28.1A9.5 9.5 0 0 1 86.2 35.4Z" />
        </svg>
        <div class="head-text">
          <h1>Marksync</h1>
          <p id="email" class="muted small"></p>
        </div>
        <button id="open-options" class="quiet" data-i18n="openOptions" data-i18n-title="openOptionsTitle"></button>
      </header>

      <!-- Search across the bookmarks in this browser; results replace the rest of the popup. -->
      <div class="find" role="search">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.5" />
          <path d="M13 13l4 4" />
        </svg>
        <input
          id="find"
          type="search"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="results"
          aria-expanded="false"
          autocomplete="off"
          spellcheck="false"
          maxlength="200"
          data-i18n-placeholder="findPlaceholder"
          data-i18n-aria-label="findLabel"
        />
        <kbd class="find-key" aria-hidden="true">/</kbd>
      </div>
      <!-- The most used tags; a click searches for one. -->
      <div id="tag-bar" class="tag-bar" role="group" data-i18n-aria-label="tagsBarLabel" hidden></div>

      <section id="find-results" class="find-results" hidden>
        <p id="results-count" class="muted small" role="status"></p>
        <ul id="results" class="results" role="listbox" data-i18n-aria-label="findLabel"></ul>
        <p class="muted small find-hint" data-i18n="findHint"></p>
      </section>

      <section id="disconnected" class="stack" hidden>
        <p data-i18n="popupIntro"></p>
        <p class="muted small" data-i18n="privacyNote"></p>
        <button id="connect" class="primary wide" data-i18n="connectDrive"></button>
      </section>

      <section id="connected" class="stack" hidden>
        <div class="status">
          <p id="summary-main" class="status-main"></p>
          <div id="summary" class="status-facts"></div>
        </div>

        <div id="mass-delete" class="notice warn stack" hidden>
          <p id="mass-delete-text" class="small"></p>
          <div class="row wrap">
            <button id="confirm-delete" class="danger"></button>
            <button id="bring-back" data-i18n="bringBack"></button>
            <button id="keep-local" data-i18n="keepLocal" hidden></button>
          </div>
        </div>

        <div id="error" class="notice error small" hidden></div>

        <div class="actions">
          <button id="sync" class="primary" data-i18n="syncNow"></button>
          <button id="backup" data-i18n="backupNow"></button>
        </div>
        <p id="backup-summary" class="muted small"></p>
      </section>

      <!-- Rediscover: a few forgotten bookmarks (Settings → Sync → Rediscover). -->
      <section id="digest" class="digest" aria-labelledby="digest-h" hidden>
        <header class="digest-head">
          <h2 id="digest-h" data-i18n="digestHeading"></h2>
          <span id="digest-count" class="pill"></span>
        </header>
        <ul id="digest-list" class="digest-list"></ul>
      </section>

      <!-- OpenRouter spending: shown while AI sorting is on and a key is saved. -->
      <section id="usage" class="usage" aria-labelledby="usage-h" hidden>
        <header class="usage-head">
          <h2 id="usage-h">OpenRouter</h2>
          <span id="usage-source" class="pill"></span>
          <button id="usage-refresh" class="icon-button" data-i18n-title="usageRefresh" data-i18n-aria-label="usageRefresh">
            <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
              <path d="M16 10a6 6 0 1 1-1.8-4.3" />
              <path d="M16.2 3.2v3.6h-3.6" />
            </svg>
          </button>
        </header>

        <div class="usage-balance">
          <span id="usage-big" class="usage-big"></span>
          <span id="usage-big-label" class="muted small"></span>
        </div>

        <div id="usage-gauge" class="gauge" role="meter" aria-valuemin="0" aria-valuemax="100">
          <span class="gauge-fill"></span>
        </div>
        <p id="usage-line" class="muted small"></p>

        <!-- What AI sorting in this browser spent this month, against the monthly cap. -->
        <div id="usage-budget" class="budget">
          <div class="budget-row">
            <span class="small" data-i18n="usageBudgetLabel"></span>
            <span id="usage-budget-text" class="budget-amount small"></span>
          </div>
          <div id="usage-budget-gauge" class="gauge thin" role="meter" aria-valuemin="0" aria-valuemax="100">
            <span class="gauge-fill"></span>
          </div>
          <p id="usage-budget-note" class="notice small" hidden></p>
        </div>

        <dl id="usage-periods" class="usage-periods">
          <div><dt data-i18n="usageToday"></dt><dd id="usage-today"></dd></div>
          <div><dt data-i18n="usageWeek"></dt><dd id="usage-week"></dd></div>
          <div><dt data-i18n="usageMonth"></dt><dd id="usage-month"></dd></div>
        </dl>

        <footer class="usage-foot">
          <span id="usage-model" class="usage-model small"></span>
          <a id="usage-topup" class="small" href="https://openrouter.ai/settings/credits" target="_blank" rel="noopener" data-i18n="usageTopUp"></a>
        </footer>
        <p id="usage-note" class="usage-note small" hidden></p>
      </section>

      <nav class="links">
        <button id="import" class="quiet" data-i18n="popupImport"></button>
        <button id="open-dupes" class="quiet" data-i18n="dupOpen"></button>
        <button id="open-log" class="quiet" data-i18n="aiOpenLog"></button>
      </nav>

      <p id="action-error" class="notice error small" role="alert" hidden></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
