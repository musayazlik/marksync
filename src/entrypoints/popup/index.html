<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marksync</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Text comes from src/public/_locales (see src/shared/i18n.ts). -->
    <main class="stack">
      <header class="row spread">
        <div class="row">
          <img src="/icon/32.png" srcset="/icon/64.png 2x" width="32" height="32" alt="" />
          <h1>Marksync</h1>
          <span id="dot" class="dot"></span>
        </div>
        <button id="open-options" data-i18n="openOptions" data-i18n-title="openOptionsTitle"></button>
      </header>

      <section id="disconnected" class="stack" hidden>
        <p data-i18n="popupIntro"></p>
        <p class="muted small" data-i18n="privacyNote"></p>
        <button id="connect" class="primary" data-i18n="connectDrive"></button>
      </section>

      <section id="connected" class="stack" hidden>
        <div class="card stack">
          <p id="email"></p>
          <p id="summary" class="muted small"></p>
        </div>

        <div id="mass-delete" class="notice warn stack" hidden>
          <p id="mass-delete-text"></p>
          <div class="row">
            <button id="confirm-delete" class="danger"></button>
            <button id="bring-back" data-i18n="bringBack"></button>
            <button id="keep-local" data-i18n="keepLocal" hidden></button>
          </div>
        </div>

        <div id="error" class="notice error small" hidden></div>

        <div class="row">
          <button id="sync" class="primary" data-i18n="syncNow"></button>
          <button id="backup" data-i18n="backupNow"></button>
        </div>
        <p id="backup-summary" class="muted small"></p>
      </section>

      <button id="import" data-i18n="popupImport"></button>

      <p id="action-error" class="notice error small" hidden></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
