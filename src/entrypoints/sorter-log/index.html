<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="aiLogTitle">Marksync</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Text comes from src/public/_locales (see src/shared/i18n.ts). -->
    <header class="top">
      <div class="top-inner">
        <svg class="emblem" data-state="ok" viewBox="0 0 100 100" width="40" height="40" aria-hidden="true">
          <path class="front" d="M23.8 4.1L54.9 4.1A10 10 0 0 1 64.9 14.1L64.9 22.8A7.2 7.2 0 0 1 62.3 28.4L21.3 62.5A4.6 4.6 0 0 1 13.8 59L13.8 14.1A10 10 0 0 1 23.8 4.1Z" />
          <path class="back" d="M86.2 35.4L86.2 91.4A4.4 4.4 0 0 1 79.1 94.9L57.6 78.6A0.8 0.8 0 0 0 56.6 78.6L36 94.3A4.4 4.4 0 0 1 28.9 90.8L28.9 64.9A5.2 5.2 0 0 1 30.8 60.8L70.7 28.1A9.5 9.5 0 0 1 86.2 35.4Z" />
        </svg>
        <div class="top-text">
          <h1 data-i18n="aiLogTitle"></h1>
          <p class="muted small" id="intro"></p>
        </div>
        <a class="button" href="./options.html#ai" data-i18n="aiLogBack"></a>
      </div>
    </header>

    <main>
      <div class="toolbar">
        <div class="segmented" role="radiogroup" id="filter" data-i18n-aria-label="aiLogShow">
          <span class="segmented-thumb" aria-hidden="true"></span>
          <button role="radio" data-filter="all"><span data-i18n="aiLogFilterAll"></span><b data-count="all"></b></button>
          <button role="radio" data-filter="moved"><span data-i18n="aiLogFilterMoved"></span><b data-count="moved"></b></button>
          <button role="radio" data-filter="kept"><span data-i18n="aiLogFilterKept"></span><b data-count="kept"></b></button>
          <button role="radio" data-filter="error"><span data-i18n="aiLogFilterErrors"></span><b data-count="error"></b></button>
        </div>
        <input id="search" type="search" data-i18n-placeholder="aiLogSearch" data-i18n-aria-label="aiLogSearch" />
        <button id="clear" class="quiet danger" data-i18n="aiLogClear"></button>
      </div>

      <ol id="log" class="timeline"></ol>
      <div id="empty" class="empty" hidden>
        <svg viewBox="0 0 24 32" width="28" height="36" aria-hidden="true"><path d="M2 2h20v28l-10-7-10 7z" /></svg>
        <p data-i18n="aiLogEmpty"></p>
      </div>
    </main>

    <p id="action-error" class="notice error small toast" role="alert" hidden></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
