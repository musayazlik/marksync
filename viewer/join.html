<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4051ea" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; connect-src 'self' https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https:; font-src 'self'" />
    <title>Marksync – join a shared folder</title>
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  </head>
  <body>
    <header class="bar">
      <img src="./logo.svg" alt="" width="28" height="28" />
      <h1>Marksync</h1>
    </header>
    <main>
      <section class="card stack">
        <h2 id="title"></h2>
        <p id="text" class="muted"></p>
        <button id="accept" class="primary wide"></button>
        <p id="message" class="notice small" role="status" hidden></p>
      </section>
      <section id="done" class="card stack" hidden>
        <h2 id="done-title"></h2>
        <p id="done-text" class="muted"></p>
        <div class="code-row">
          <code id="code"></code>
          <button id="copy" class="quiet"></button>
        </div>
        <p id="done-steps" class="muted small"></p>
      </section>
    </main>
    <script type="module" src="./join.ts"></script>
  </body>
</html>
